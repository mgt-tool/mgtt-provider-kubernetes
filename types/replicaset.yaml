facts:
  ready_replicas:
    type: mgtt.int
    ttl: 30s
    probe:
      cmd: "kubectl -n {namespace} get replicaset {name} -o jsonpath={.status.readyReplicas}"
      parse: int
      cost: low
  desired_replicas:
    type: mgtt.int
    ttl: 30s
    probe:
      cmd: "kubectl -n {namespace} get replicaset {name} -o jsonpath={.spec.replicas}"
      parse: int
      cost: low
  available_replicas:
    type: mgtt.int
    ttl: 30s
    probe:
      cmd: "kubectl -n {namespace} get replicaset {name} -o jsonpath={.status.availableReplicas}"
      parse: int
      cost: low

healthy:
  - ready_replicas >= desired_replicas   # more ready than desired: a scale-down in progress

states:
  scaled_to_zero:
    when: "desired_replicas == 0"
    description: inactive revision
  live:
    when: "ready_replicas >= desired_replicas"
    description: all replicas ready
  degraded:
    when: "ready_replicas < desired_replicas"
    description: some pods not ready

default_active_state: live
# Scaled to zero on purpose is not a failure; a model that needs the
# replicas says so in its own states:.
healthy_in: [scaled_to_zero]

failure_modes:
  degraded:
    can_cause: [upstream_failure, timeout]
